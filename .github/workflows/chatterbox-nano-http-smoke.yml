name: Chatterbox Nano HTTP Smoke

on:
  push:
    branches:
      - architecture/device-http-runtime-v1
    paths:
      - "device-runtime/providers/chatterbox-nano-http/**"
      - "tests/chatterbox_nano_http_smoke.py"
      - ".github/workflows/chatterbox-nano-http-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chatterbox Nano runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install chatterbox-tts==0.1.7
      - name: Run HTTP smoke
        run: python tests/chatterbox_nano_http_smoke.py
