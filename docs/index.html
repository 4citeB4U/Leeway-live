<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111d"><link rel="icon" href="data:,"><title>LeeWay Live</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app-shell"><header class="topbar"><div class="identity"><strong>LeeWay Live</strong><span id="runtimeStatus">BOOTING LIVE RUNTIME…</span></div><div style="display:flex;gap:.5rem"><button id="connectLocal" class="icon-button" aria-label="Connect local LeeWay Runtime Fabric">CONNECT LOCAL</button><button id="cameraToggle" class="icon-button" aria-label="Toggle camera">CAM</button></div></header>
