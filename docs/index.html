<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<link rel="icon" href="data:,">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>Agent Lee — LeeWay Live</title>
</head>
<body>
<main class="sensory-shell">
  <section class="vision-frame" id="cameraPanel" aria-label="Agent Lee vision">
    <video id="cameraView" autoplay muted playsinline></video>
    <div class="vision-placeholder" id="cameraPlaceholder"><span>VISION</span><small>tap eye to enable</small></div>
    <span class="vision-state" id="cameraStatus">OFF</span>
  </section>

  <section class="agent-stage">
    <button class="sphere-button" id="agentSphereButton" aria-label="Talk to Agent Lee">
      <div class="agent-sphere" id="agentSphere" data-state="idle">
        <div class="fluid-layer fluid-a"></div>
        <div class="fluid-layer fluid-b"></div>
        <div class="sphere-glow"></div>
        <div class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </button>
    <div class="state-label" id="stateLabel">READY</div>
    <div class="agent-caption" id="agentText" role="status" aria-live="polite">Tap the sphere and speak.</div>
  </section>

  <section class="controls" aria-label="Sensory controls">
    <button id="micButton" class="control-button primary" aria-label="Talk to Agent Lee" aria-pressed="false"><span class="control-icon">●</span><span>TALK</span></button>
    <button id="cameraToggle" class="control-button" aria-label="Toggle camera vision"><span class="control-icon">◉</span><span>VISION</span></button>
    <button id="seeButton" class="control-button" aria-label="Ask Agent Lee what the camera sees"><span class="control-icon">◎</span><span>SEE</span></button>
  </section>

  <section class="transcript" id="userBubble" hidden><span id="userTranscript"></span></section>

  <section class="composer">
    <div class="input-row">
      <input id="textInput" type="text" autocomplete="off" placeholder="Message Agent Lee…" aria-label="Message Agent Lee">
      <button id="sendButton" class="send-button" aria-label="Send">↑</button>
    </div>
  </section>

  <details class="system-drawer">
    <summary>System</summary>
    <div class="system-grid">
      <div><b>Runtime</b><span id="runtimeStatus">CONNECTING…</span></div>
      <div><b>Voice</b><span id="voiceStatus">VERIFYING LEEWAY VOICE…</span></div>
      <div><b>Phone</b><span id="phoneStatus">NOT PAIRED</span></div>
    </div>
    <div class="system-actions">
      <button id="connectLocal" class="utility-button">VERIFY LOCAL</button>
      <a id="installButton" class="utility-button" href="#" aria-disabled="true">PHONE PACKAGE</a>
    </div>
    <div id="packageInfo" class="fineprint">Discovering canonical Device Bridge package…</div>
    <details class="pairing">
      <summary>Phone pairing</summary>
      <input id="phoneDeviceId" type="text" autocomplete="off" placeholder="Phone Device ID">
      <input id="phonePairingToken" type="password" autocomplete="off" placeholder="Owner pairing token">
      <div><button id="connectPhone" class="utility-button">CONNECT</button><button id="forgetPhone" class="utility-button">FORGET</button></div>
    </details>
    <details class="evidence-panel"><summary>Evidence</summary><pre id="evidenceTrace"></pre></details>
  </details>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
