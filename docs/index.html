<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111d"><title>LeeWay Live</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head>
<body><main class="app-shell"><header class="topbar"><div class="identity"><strong>LeeWay Live</strong><span>PHONE LAB</span></div><button id="cameraToggle" class="icon-button" aria-label="Toggle camera">CAM</button></header>
<section class="camera-pip" id="cameraPanel"><video id="cameraView" autoplay muted playsinline></video><div class="camera-placeholder" id="cameraPlaceholder">CAMERA</div><span class="camera-status" id="cameraStatus">OFF</span></section>
<section class="conversation-stage"><div class="speech-bubble agent-bubble" role="status" aria-live="polite"><span id="agentText">Tap the microphone when you're ready.</span></div>
<div class="sphere-wrap"><div class="agent-sphere" id="agentSphere" data-state="idle"><div class="sphere-core">L</div><div class="sphere-ring ring-one"></div><div class="sphere-ring ring-two"></div></div><div class="state-label" id="stateLabel">READY</div></div>
<button id="micButton" class="mic-button" aria-label="Start voice input" aria-pressed="false"><span class="mic-glyph">●</span><span>MIC</span></button></section>
<section class="composer"><div class="speech-bubble user-bubble" id="userBubble" hidden><span id="userTranscript"></span></div><div class="input-row"><input id="textInput" type="text" autocomplete="off" placeholder="Type to LeeWay Live…" aria-label="Message"><button id="sendButton" class="send-button">SEND</button></div></section>
<details class="evidence-panel"><summary>Evidence</summary><pre id="evidenceTrace"></pre></details></main><script type="module" src="./app.js"></script></body></html>
